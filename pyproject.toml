[project]
name = "tool-guard"
version = "1.0.0"
description = "Tool Guard: isolated planning defense against tool description poisoning"
readme = "README.md"
requires-python = ">= 3.10"
license = { text = "MIT" }
authors = [
    { name = "Shanghao Shi" },
]
keywords = [
    "llm-agents",
    "prompt-injection",
    "tool-description-poisoning",
    "security",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Security",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "openai>=1.59.7",
    "pydantic[email]>=2.7.1",
    "docstring-parser>=0.15",
    "tenacity>=8.2.3",
    "langchain>=0.1.17",
    "typing-extensions>=4.11.0",
    "anthropic>=0.47.0",
    "cohere>=5.3.4",
    "pyyaml>=6.0.1",
    "click>=8.1.7",
    "deepdiff>=8.6.1",
    "rich>=13.7.1",
    "python-dotenv>=1.0.1",
    "google-genai>=1.15.0",
]

[project.urls]
repository = "https://github.com/shishishi123/Tool-Guard"

[project.optional-dependencies]
transformers = ["transformers>=4.41.2", "torch>=2.2.1"]
drift = ["torch>=2.2.1"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["src/agentdojo"]

[tool.ruff]
line-length = 120
[tool.ruff.lint]
select = ["F", "UP", "I", "ERA", "N", "RUF"]

[tool.pyright]
pythonVersion = "3.10"
